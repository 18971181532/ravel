name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 跑测试
        run: python run_tests.py
      - name: 无参数入口
        run: python run.py bench --repeat 1 --packages 8 --versions 2
      - name: 演示脚本
        run: python run_demos.py

  package:
    name: 打包安装
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: ravel --version
      - run: ravel solve "web ^1.0" "metrics ^1.0"
      - name: 无解时把原因讲出来（退出码 1 是预期结果，不是失败）
        run: |
          set +e
          ravel explain "web ^2.0" "http ^1.0"
          test $? -eq 1
