[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ravel"
version = "1.0.0"
description = "依赖版本求解器：用 PubGrub 求解，装不上时把推导过程一句句讲出来"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "遥か" }]
keywords = ["dependencies", "pubgrub", "resolver", "semver", "versionsolver"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
ravel = "ravel.cli:main"

[project.urls]
Homepage = "https://github.com/18971181532/ravel"
Source = "https://github.com/18971181532/ravel"

[tool.setuptools]
packages = ["ravel"]
